<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Court-Score-Test - RPC vs. Subscription</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f3f5f7; color: #24313d; font-family: Arial, sans-serif; }
    h1 { margin: 0 0 20px; text-align: center; }
    .controls, .status { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    button { padding: 10px 22px; border: 0; border-radius: 8px; color: #fff; cursor: pointer; font-weight: 700; }
    #btnPoll { background: #0d6efd; }
    #btnWs { background: #6f42c1; }
    #btnStop { background: #dc3545; }
    button.active { outline: 3px solid #198754; outline-offset: 2px; }
    .badge { padding: 4px 12px; border-radius: 999px; background: #f8d7da; color: #9b1c2c; font-weight: 700; }
    .badge.poll { background: #cfe2ff; color: #084298; }
    .badge.push, .badge.ok { background: #d1e7dd; color: #0f5132; }
    .columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .column, .log { padding: 18px; border: 2px solid #d7dde3; border-radius: 12px; background: #fff; }
    .column:first-child { border-color: #0d6efd; }
    .column:last-child { border-color: #6f42c1; }
    .column h2, .log h2 { margin: 0 0 12px; font-size: 1rem; text-align: center; }
    .court { margin-bottom: 12px; padding: 10px; border-radius: 8px; background: #f7f8f9; }
    .court-title { margin-bottom: 6px; font-weight: 700; }
    .score-row { display: grid; grid-template-columns: minmax(80px, 1fr) repeat(4, 40px); gap: 7px; margin-top: 5px; }
    .score-cell { padding: 4px; border-radius: 4px; background: #0d6efd; color: #fff; text-align: center; }
    .score-cell.label { background: transparent; color: #24313d; text-align: left; font-weight: 700; }
    .score-cell.points { background: #6f42c1; }
    .log { max-height: 260px; margin-top: 20px; overflow-y: auto; }
    .log-entry { padding: 3px 0; border-bottom: 1px solid #eef0f2; color: #68737d; font: 0.78rem monospace; }
    .log-entry.push { color: #198754; }
    .log-entry.poll { color: #0d6efd; }
    .log-entry.error { color: #dc3545; }
    @media (max-width: 720px) { .columns { grid-template-columns: 1fr; } body { padding: 14px; } }
  </style>
</head>
<body>
  <h1>Court-Score-Test - RPC vs. Subscription</h1>
  <div class="controls">
    <button id="btnPoll" type="button">RPC-Polling starten</button>
    <button id="btnWs" type="button">Subscription starten</button>
    <button id="btnStop" type="button">Alles stoppen</button>
  </div>
  <div class="status" aria-live="polite">
    <span>Modus:</span><span class="badge" id="statusBadge">Gestoppt</span>
    <span>Updates: <strong id="updateCount">0</strong></span>
    <span>Letzte Aktualisierung: <strong id="lastUpdate">-</strong></span>
  </div>
  <div class="columns">
    <section class="column">
      <h2>RPC-Polling (vom Service)</h2>
      <div id="pollData">Keine Daten</div>
    </section>
    <section class="column">
      <h2>WebSocket-Subscription</h2>
      <div id="wsData">Keine Daten</div>
    </section>
  </div>
  <section class="log">
    <h2>Log</h2>
    <div id="logContainer" aria-live="polite"></div>
  </section>
  <script type="module" src="JS/courtScoreTest.js"></script>
</body>
</html>
