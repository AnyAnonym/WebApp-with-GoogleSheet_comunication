global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    deployment: paj

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["127.0.0.1:12345"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:3000"]

  - job_name: epiber
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - targets/enabled/*.json
